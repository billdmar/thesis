name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# SEC fair-access: CI NEVER hits live EDGAR. It runs entirely on committed
# fixtures under data/fixtures/. The `live` pytest marker is deselected.
env:
  THESIS_OFFLINE: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install WeasyPrint system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libffi-dev libcairo2

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Format check (ruff)
        run: ruff format --check src tests

      - name: Tests + coverage (fixtures only, no live EDGAR; gate >=90%)
        run: |
          pytest -m "not live" \
            --cov=src --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=90
